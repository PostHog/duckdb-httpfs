#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> $GITHUB_OUTPUT

  duckdb-stable-build:
    name: Build extension binaries
    needs: get-duckdb-version
    # PostHog fork of extension-ci-tools: internal actions are pinned to SHAs
    # (the PostHog org ruleset rejects unpinned action refs, even inside a
    # SHA-referenced reusable workflow) and it exposes the `runners` input.
    uses: PostHog/extension-ci-tools/.github/workflows/_extension_distribution.yml@d3e0ee09e2e392941f2e390e6cbab108a095daa4
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: d3e0ee09e2e392941f2e390e6cbab108a095daa4
      override_ci_tools_repository: PostHog/extension-ci-tools
      extension_name: httpfs
      runners: |
        {"linux_amd64": "depot-ubuntu-24.04-16", "linux_arm64": "depot-ubuntu-24.04-arm-16"}

  publish-github-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: [get-duckdb-version, duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      DUCKDB_VERSION: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
    steps:
      - name: Download linux amd64 extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: httpfs-${{ env.DUCKDB_VERSION }}-extension-linux_amd64
          path: release-assets/linux_amd64

      - name: Download linux arm64 extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: httpfs-${{ env.DUCKDB_VERSION }}-extension-linux_arm64
          path: release-assets/linux_arm64

      - name: Stage release assets
        run: |
          mkdir -p release-assets/staged
          cp release-assets/linux_amd64/httpfs.duckdb_extension release-assets/staged/httpfs-linux-amd64.duckdb_extension
          cp release-assets/linux_arm64/httpfs.duckdb_extension release-assets/staged/httpfs-linux-arm64.duckdb_extension
          cd release-assets/staged
          sha256sum httpfs-linux-amd64.duckdb_extension httpfs-linux-arm64.duckdb_extension > checksums.txt

      - name: Create or update GitHub Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "PostHog httpfs extension (stoi/stoull Content-Length overflow fix) for DuckDB ${DUCKDB_VERSION}."
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/staged/httpfs-linux-amd64.duckdb_extension \
            release-assets/staged/httpfs-linux-arm64.duckdb_extension \
            release-assets/staged/checksums.txt \
            --clobber
